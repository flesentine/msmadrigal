name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install retro speech generator
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Build web site and C64 voice banks
        run: |
          mkdir -p _site
          cp index.html styles.css app.js petscii.css petscii.js split-teacher.css vocab.csv privacy.html support.html _site/
          cp -R assets _site/assets
          python3 tools/build_web_audio.py --vocab vocab.csv --out _site/audio

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
