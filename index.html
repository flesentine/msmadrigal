<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ms. Madrigral — Spanish 500</title>
  <link rel="stylesheet" href="styles.css?v=53">
  <link rel="stylesheet" href="petscii.css?v=53">
</head>
<body>
  <main class="page-shell">
    <section id="game" class="game" aria-label="Ms. Madrigral Spanish vocabulary game">
      <div class="scanlines" aria-hidden="true"></div>

      <header class="masthead">
        <div class="title">MS. MADRIGRAL</div>
        <div class="subtitle">500 WORD VOCABULARY</div>
      </header>

      <div class="scene">
        <div id="teacher" class="teacher" aria-hidden="true">
          <img id="teacherSprite" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
          <img class="pointer" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
        </div>

        <button id="board" class="board" type="button" aria-label="Vocabulary card. Click to flip or advance.">
          <span id="word" class="word" aria-live="polite"></span>
        </button>
      </div>

      <footer class="statusbar" aria-live="polite">
        <span id="prompt">CLICK / TAP / SPACE TO START</span>
        <span id="progress" class="progress">0 / 500</span>
      </footer>

      <div class="controls" aria-label="Game controls">
        <button id="shuffleButton" class="mini-button" type="button">RESHUFFLE</button>
        <button id="muteButton" class="mini-button" type="button" aria-pressed="false">SOUND ON</button>
      </div>

      <div id="startOverlay" class="start-overlay" role="button" tabindex="0" aria-label="Start Ms. Madrigral Spanish class">
        <div class="start-panel">
          <div id="startLogo" class="start-logo">MS. MADRIGRAL</div>
          <div id="startSubtitle" class="start-subtitle">SPANISH 500</div>
          <button id="startButton" class="start-button" type="button">START CLASS</button>
          <div id="startHint" class="start-hint">C64 VOICE - CLICK / TAP / SPACE TO PLAY</div>
        </div>
      </div>
    </section>
    <p class="help">CLICK THE CHALKBOARD OR PRESS <kbd>SPACE</kbd>: ENGLISH → SPANISH → NEXT WORD. PRESS <kbd>R</kbd> TO RESHUFFLE.</p>
  </main>

  <script src="app.js?v=53"></script>
  <script src="petscii.js?v=53"></script>
</body>
</html>
