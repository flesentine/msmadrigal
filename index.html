<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ms. Madrigral — Spanish 500</title>
  <link rel="stylesheet" href="styles.css?v=72">
  <link rel="stylesheet" href="petscii.css?v=72">
  <style>
    /* Explicit original-teacher lower-body frames. */
    .teacher-leg-viewport { display: none !important; }
    .teacher > .v62-leg-frame {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 76%;
      height: auto;
      z-index: 2;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    .teacher > .v62-leg-a { opacity: 1; }
    .teacher > .v62-leg-b { opacity: 0; }
    .teacher.walking > .v62-leg-a { animation: v62-leg-a 230ms steps(1, end) infinite; }
    .teacher.walking > .v62-leg-b { animation: v62-leg-b 230ms steps(1, end) infinite; }
    @keyframes v62-leg-a {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes v62-leg-b {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    .teacher .pointer { z-index: 3; }

    /* V70 CRT model.
       This stays DOM-native so input, responsive layout and PETSCII remain sharp
       underneath the simulated phosphor/glass instead of rasterizing the app. */
    .game {
      border-radius: 16px / 12px;
      background: #020303;
    }

    /* Slight analog softness, bloom and tiny RGB registration error. */
    .game > .masthead,
    .game > .scene,
    .game > .statusbar,
    .game > .controls,
    .game > .start-overlay {
      filter:
        saturate(1.08)
        contrast(1.07)
        brightness(1.015)
        blur(.16px)
        drop-shadow(.45px 0 rgba(255,55,40,.10))
        drop-shadow(-.45px 0 rgba(55,90,255,.09));
    }

    /* Scanline + phosphor triad. The 3px raster pitch is close to a 320-wide
       C64 image expanded to the current game size, while the 3px RGB mask is
       intentionally faint enough to avoid modern-display moire. */
    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 60 !important;
      pointer-events: none;
      opacity: .92 !important;
      mix-blend-mode: normal !important;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,.20) 0,
          rgba(0,0,0,.20) 1px,
          rgba(255,255,255,.018) 1px,
          rgba(255,255,255,.018) 2px,
          transparent 2px,
          transparent 3px
        ),
        repeating-linear-gradient(
          to right,
          rgba(255,50,50,.032) 0,
          rgba(255,50,50,.032) 1px,
          rgba(65,255,95,.022) 1px,
          rgba(65,255,95,.022) 2px,
          rgba(70,90,255,.032) 2px,
          rgba(70,90,255,.032) 3px
        );
      animation: crt-phosphor-flicker 7s steps(1, end) infinite;
    }

    /* Curved glass highlight. */
    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 58;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(ellipse at 48% 42%, transparent 0 53%, rgba(0,0,0,.08) 72%, rgba(0,0,0,.34) 100%),
        linear-gradient(118deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,.012) 18%, transparent 34% 100%);
      box-shadow:
        inset 0 0 14px rgba(255,255,255,.035),
        inset 0 0 70px rgba(0,0,0,.32);
    }

    /* CRT edge falloff is stronger than a flat-panel vignette, but kept away
       from the central vocabulary area. */
    .game::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 59 !important;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(ellipse at center, transparent 0 59%, rgba(0,0,0,.05) 73%, rgba(0,0,0,.28) 100%);
      box-shadow:
        inset 0 0 34px rgba(0,0,0,.20),
        inset 0 0 95px rgba(0,0,0,.25);
    }

    @keyframes crt-phosphor-flicker {
      0%, 16%, 35%, 64%, 100% { opacity: .92; }
      17% { opacity: .905; }
      36% { opacity: .928; }
      65% { opacity: .912; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scanlines { animation: none !important; }
    }

    /* Native iOS pass: keep the App Store build clear of Dynamic Island,
       sensor housing, rounded corners and the home indicator. The website
       keeps its normal subtitle and controls. */
    html.ios-native .subtitle,
    html.ios-native .controls {
      display: none !important;
    }

    html.ios-native .masthead {
      left: calc(4% + env(safe-area-inset-left)) !important;
      right: calc(4% + env(safe-area-inset-right)) !important;
    }

    html.ios-native .statusbar {
      left: calc(5% + env(safe-area-inset-left)) !important;
      right: calc(5% + env(safe-area-inset-right)) !important;
      bottom: max(2%, env(safe-area-inset-bottom)) !important;
    }

    @media (orientation: landscape) and (max-width: 1100px) and (max-height: 850px) {
      html.ios-native .masthead {
        top: max(2.5%, env(safe-area-inset-top)) !important;
        left: calc(18% + env(safe-area-inset-left)) !important;
        right: calc(18% + env(safe-area-inset-right)) !important;
      }

      html.ios-native .scene {
        top: 8% !important;
        bottom: 4.5% !important;
        left: calc(1.5% + env(safe-area-inset-left)) !important;
        right: calc(1.5% + env(safe-area-inset-right)) !important;
      }

      html.ios-native .board {
        right: 0 !important;
        width: 61% !important;
      }

      html.ios-native .teacher {
        left: 0 !important;
      }

      html.ios-native .statusbar {
        left: calc(5% + env(safe-area-inset-left)) !important;
        right: calc(5% + env(safe-area-inset-right)) !important;
        bottom: max(1.8%, env(safe-area-inset-bottom)) !important;
      }
    }

    /* Portrait phones use the full viewport; PETSCII sizing stays in petscii.css. */
    @media (max-width: 700px) {
      html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: #050505;
      }
      body { display: block; padding: 0; }
      .page-shell { width: 100%; margin: 0; }
      .game {
        width: 100%;
        min-height: 0;
        border: 0;
        box-shadow: none;
        border-radius: 0;
      }
      .help { display: none; }
      .controls {
        top: max(8px, env(safe-area-inset-top));
        right: 8px;
        gap: 6px;
      }
      .mini-button {
        min-height: 36px;
        padding: 0 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .statusbar {
        left: 5%;
        right: 5%;
        bottom: calc(4% + env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 700px) and (orientation: portrait) {
      body {
        min-height: 100svh;
        min-height: 100dvh;
      }
      .game {
        height: 100svh;
        height: 100dvh;
        min-height: 560px;
        aspect-ratio: auto;
      }
      .masthead { top: calc(env(safe-area-inset-top) + 56px); }
      html.ios-native .masthead { top: calc(env(safe-area-inset-top) + 18px) !important; }
      .scene {
        top: 18%;
        bottom: 13%;
        left: 2%;
        right: 2%;
      }
      .board {
        top: 1%;
        right: 1%;
        width: 74%;
        height: 54%;
        padding: 5% 4%;
      }
      .teacher {
        left: 2%;
        top: 28%;
        width: 42%;
        height: 66%;
      }
      .statusbar { bottom: calc(4.5% + env(safe-area-inset-bottom)); }
      .progress { display: flex; }
      .start-panel {
        width: min(90%, 420px) !important;
        min-height: min(360px, 62svh) !important;
        min-height: min(360px, 62dvh) !important;
        padding: 28px 18px !important;
        gap: 18px !important;
      }
      #startButton { width: min(100%, 300px) !important; }
    }

    @media (max-width: 430px) and (orientation: portrait) {
      .masthead { top: calc(env(safe-area-inset-top) + 52px); }
      html.ios-native .masthead { top: calc(env(safe-area-inset-top) + 16px) !important; }
      .scene {
        top: 17%;
        bottom: 12%;
        left: 1%;
        right: 1%;
      }
      .board {
        top: 1%;
        right: 0;
        width: 78%;
        height: 52%;
      }
      .teacher {
        left: 0;
        top: 30%;
        width: 46%;
        height: 64%;
      }
      .controls {
        top: calc(env(safe-area-inset-top) + 6px);
        right: 6px;
      }
      .mini-button {
        min-height: 34px;
        padding: 0 7px;
      }
      .progress { display: none; }
      .statusbar {
        left: 4%;
        right: 4%;
        bottom: calc(3.5% + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section id="game" class="game" aria-label="Ms. Madrigral Spanish vocabulary game">
      <div class="scanlines" aria-hidden="true"></div>

      <header class="masthead">
        <div class="title">MS. MADRIGRAL</div>
        <div class="subtitle">500 WORD VOCABULARY</div>
      </header>

      <div class="scene">
        <div id="teacher" class="teacher" aria-hidden="true">
          <img id="teacherSprite" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
          <img class="v62-leg-frame v62-leg-a" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAACoCAYAAAAfI+vhAAAAuUlEQVR42u3YQQ5AMBAFUEQd1aF6VBvWbKopWry3kxAj38yIrgMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD4jz6EsOZcsMzz7niKMev8Uqn7ldb7tME7KAAB8OIdUDqj79Z6vTrACBIAFY1fm/lX74i7n1cHGEECoOUdkDtDW98Jx/pq7zgdYAQJgIqS/4JSM772d7QOQAACAAAA4LQNXMQljnXhiZMAAAAASUVORK5CYII=" alt="">
          <img class="v62-leg-frame v62-leg-b" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAACoCAYAAAAfI+vhAAAA70lEQVR42u3XQRKCMAwAQHSmPpVH8VQuevZUoLUmZffGDI6QpAlZFgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAID7eJRS3md+sK/r1/Vr207d36r2f63PO9pTDUqABLS0gN4tpqfo7efSDDgS9CgvmuE5L7Wg0YN31uCbAZkTEPkUZKn+LntAtJf7996hBd3tMzRT64lW/U5A1j3gSrX9uppqS1fU2eUEzPoZOnI2ZK3+5hMQIQmZg980A3oFIPKSlGIG1AIeqVVNmQACJMApAAAAOO4Dwr9faiabr18AAAAASUVORK5CYII=" alt="">
          <img class="pointer" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
        </div>

        <button id="board" class="board" type="button" aria-label="Vocabulary card. Click to flip or advance.">
          <span id="word" class="word" aria-live="polite"></span>
        </button>
      </div>

      <footer class="statusbar" aria-live="polite">
        <span id="prompt">CLICK / TAP TO START</span>
        <span id="progress" class="progress">0 / 500</span>
      </footer>

      <div class="controls" aria-label="Game controls">
        <button id="shuffleButton" class="mini-button" type="button">RESHUFFLE</button>
        <button id="muteButton" class="mini-button" type="button" aria-pressed="false">SOUND ON</button>
      </div>

      <div id="startOverlay" class="start-overlay" role="button" tabindex="0" aria-label="Start Ms. Madrigral Spanish class">
        <div class="start-panel">
          <div id="startLogo" class="start-logo">MS. MADRIGRAL</div>
          <div id="startSubtitle" class="start-subtitle">SPANISH 500</div>
          <button id="startButton" class="start-button" type="button">START CLASS</button>
          <div id="startHint" class="start-hint">C64 VOICE - TAP / SPACE</div>
        </div>
      </div>
    </section>
    <p class="help">CLICK THE CHALKBOARD OR PRESS <kbd>SPACE</kbd>: ENGLISH → SPANISH → NEXT WORD. PRESS <kbd>R</kbd> TO RESHUFFLE.</p>
  </main>

  <script src="app.js?v=72"></script>
  <script src="petscii.js?v=72"></script>
</body>
</html>
