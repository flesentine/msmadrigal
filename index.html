<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ms. Madrigral — Spanish 500</title>
  <link rel="stylesheet" href="styles.css?v=64">
  <link rel="stylesheet" href="petscii.css?v=64">
  <style>
    /* V62: hide the older experimental leg viewport completely. */
    .teacher-leg-viewport { display: none !important; }

    /* Full-size overlays align pixel-for-pixel with the original 96x168 teacher. */
    .teacher > .v62-leg-frame {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 76%;
      height: auto;
      z-index: 2;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    .teacher > .v62-leg-a { opacity: 1; }
    .teacher > .v62-leg-b { opacity: 0; }

    /* Make the leg change obvious while she crosses the room. */
    .teacher.walking > .v62-leg-a {
      animation: v62-leg-a 230ms steps(1, end) infinite;
    }
    .teacher.walking > .v62-leg-b {
      animation: v62-leg-b 230ms steps(1, end) infinite;
    }
    @keyframes v62-leg-a {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes v62-leg-b {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    .teacher .pointer { z-index: 3; }

    /* V63 mobile layout: preserve the C64 scene, but use the phone's full screen. */
    @media (max-width: 700px) {
      html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        background: #050505;
      }
      body {
        display: block;
        padding: 0;
      }
      .page-shell {
        width: 100%;
        margin: 0;
      }
      .game {
        width: 100%;
        min-height: 0;
        border: 0;
        box-shadow: none;
      }
      .help { display: none; }
      .controls {
        top: max(8px, env(safe-area-inset-top));
        right: 8px;
        gap: 6px;
      }
      .mini-button {
        min-height: 36px;
        padding: 0 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .statusbar {
        left: 5%;
        right: 5%;
        bottom: calc(4% + env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 700px) and (orientation: portrait) {
      body {
        min-height: 100svh;
        min-height: 100dvh;
      }
      .game {
        height: 100svh;
        height: 100dvh;
        min-height: 560px;
        aspect-ratio: auto;
      }
      .masthead {
        top: calc(env(safe-area-inset-top) + 56px);
      }
      .scene {
        top: 18%;
        bottom: 13%;
        left: 2%;
        right: 2%;
      }
      .board {
        top: 1%;
        right: 1%;
        width: 74%;
        height: 54%;
        padding: 5% 4%;
      }
      .teacher {
        left: 2%;
        top: 28%;
        width: 42%;
        height: 66%;
      }
      .statusbar {
        bottom: calc(4.5% + env(safe-area-inset-bottom));
      }
      .progress {
        display: flex;
      }
      .petscii-word {
        height: 18px !important;
        max-width: 92% !important;
      }
      .petscii-prompt {
        height: 8px !important;
        max-width: 82vw !important;
      }
      .start-panel {
        width: min(90%, 420px) !important;
        min-height: min(360px, 62svh) !important;
        min-height: min(360px, 62dvh) !important;
        padding: 28px 18px !important;
        gap: 18px !important;
      }
      #startButton {
        width: min(100%, 300px) !important;
      }
    }

    @media (max-width: 430px) and (orientation: portrait) {
      .masthead {
        top: calc(env(safe-area-inset-top) + 52px);
      }
      .scene {
        top: 17%;
        bottom: 12%;
        left: 1%;
        right: 1%;
      }
      .board {
        top: 1%;
        right: 0;
        width: 78%;
        height: 52%;
      }
      .teacher {
        left: 0;
        top: 30%;
        width: 46%;
        height: 64%;
      }
      .controls {
        top: calc(env(safe-area-inset-top) + 6px);
        right: 6px;
      }
      .mini-button {
        min-height: 34px;
        padding: 0 7px;
      }
      .progress { display: none; }
      .statusbar {
        left: 4%;
        right: 4%;
        bottom: calc(3.5% + env(safe-area-inset-bottom));
      }
      .petscii-title { height: 13px !important; }
      .petscii-subtitle { height: 10px !important; }
      .petscii-word { height: 17px !important; }
      .petscii-prompt { height: 7px !important; max-width: 90vw !important; }
      .petscii-mini { height: 7px !important; }
    }

    /* V64: shallow landscape screens use nearly the whole viewport. */
    @media (orientation: landscape) and (max-height: 850px) {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
      }
      body {
        display: block;
        padding: 0;
      }
      .page-shell {
        width: 100%;
        height: 100svh;
        height: 100dvh;
        margin: 0;
      }
      .game {
        width: 100%;
        height: 100svh;
        height: 100dvh;
        min-height: 0;
        aspect-ratio: auto;
        border: 0;
        box-shadow: none;
      }
      .help { display: none; }

      .masthead { top: 2.5%; }
      .petscii-title { height: 14px !important; }
      .petscii-subtitle { height: 10px !important; margin-top: 3px !important; }

      .scene {
        top: 11%;
        bottom: 6%;
        left: 2%;
        right: 2%;
      }
      .board {
        top: 3%;
        right: 0;
        width: 61%;
        height: 75%;
        padding: 3% 4%;
      }
      .teacher {
        left: 4%;
        top: 1%;
        width: 27%;
        height: 96%;
      }

      .controls {
        top: max(5px, env(safe-area-inset-top));
        right: max(7px, env(safe-area-inset-right));
        gap: 5px;
      }
      .mini-button {
        min-height: 32px;
        padding: 0 8px;
      }
      .petscii-mini { height: 7px !important; }

      .statusbar {
        left: 8%;
        right: 8%;
        bottom: calc(1.5% + env(safe-area-inset-bottom));
      }
      .petscii-word { height: 17px !important; }
      .petscii-prompt { height: 7px !important; max-width: 76vw !important; }
      .petscii-progress { height: 7px !important; }

      .start-panel {
        width: min(70%, 520px) !important;
        min-height: min(270px, 72dvh) !important;
        padding: 18px 24px !important;
        gap: 12px !important;
      }
      #startButton {
        min-height: 44px !important;
        flex-basis: 44px !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section id="game" class="game" aria-label="Ms. Madrigral Spanish vocabulary game">
      <div class="scanlines" aria-hidden="true"></div>

      <header class="masthead">
        <div class="title">MS. MADRIGRAL</div>
        <div class="subtitle">500 WORD VOCABULARY</div>
      </header>

      <div class="scene">
        <div id="teacher" class="teacher" aria-hidden="true">
          <img id="teacherSprite" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
          <img class="v62-leg-frame v62-leg-a" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAACoCAYAAAAfI+vhAAAAuUlEQVR42u3YQQ5AMBAFUEQd1aF6VBvWbKopWry3kxAj38yIrgMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD4jz6EsOZcsMzz7niKMev8Uqn7ldb7tME7KAAB8OIdUDqj79Z6vTrACBIAFY1fm/lX74i7n1cHGEECoOUdkDtDW98Jx/pq7zgdYAQJgIqS/4JSM772d7QOQAACAAAA4LQNXMQljnXhiZMAAAAASUVORK5CYII=" alt="">
          <img class="v62-leg-frame v62-leg-b" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAACoCAYAAAAfI+vhAAAA70lEQVR42u3XQRKCMAwAQHSmPpVH8VQuevZUoLUmZffGDI6QpAlZFgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAID7eJRS3md+sK/r1/Vr207d36r2f63PO9pTDUqABLS0gN4tpqfo7efSDDgS9CgvmuE5L7Wg0YN31uCbAZkTEPkUZKn+LntAtJf7996hBd3tMzRT64lW/U5A1j3gSrX9uppqS1fU2eUEzPoZOnI2ZK3+5hMQIQmZg980A3oFIPKSlGIG1AIeqVVNmQACJMApAAAAOO4Dwr9faiabr18AAAAASUVORK5CYII=" alt="">
          <img class="pointer" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
        </div>

        <button id="board" class="board" type="button" aria-label="Vocabulary card. Click to flip or advance.">
          <span id="word" class="word" aria-live="polite"></span>
        </button>
      </div>

      <footer class="statusbar" aria-live="polite">
        <span id="prompt">CLICK / TAP / SPACE TO START</span>
        <span id="progress" class="progress">0 / 500</span>
      </footer>

      <div class="controls" aria-label="Game controls">
        <button id="shuffleButton" class="mini-button" type="button">RESHUFFLE</button>
        <button id="muteButton" class="mini-button" type="button" aria-pressed="false">SOUND ON</button>
      </div>

      <div id="startOverlay" class="start-overlay" role="button" tabindex="0" aria-label="Start Ms. Madrigral Spanish class">
        <div class="start-panel">
          <div id="startLogo" class="start-logo">MS. MADRIGRAL</div>
          <div id="startSubtitle" class="start-subtitle">SPANISH 500</div>
          <button id="startButton" class="start-button" type="button">START CLASS</button>
          <div id="startHint" class="start-hint">C64 VOICE - CLICK / TAP / SPACE TO PLAY</div>
        </div>
      </div>
    </section>
    <p class="help">CLICK THE CHALKBOARD OR PRESS <kbd>SPACE</kbd>: ENGLISH → SPANISH → NEXT WORD. PRESS <kbd>R</kbd> TO RESHUFFLE.</p>
  </main>

  <script src="app.js?v=64"></script>
  <script src="petscii.js?v=64"></script>
</body>
</html>
