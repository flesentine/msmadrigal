  <style id="split-teacher-v57">
    .teacher { overflow: visible; }
    .teacher > #teacherSprite { display:none !important; }

    .teacher > .teacher-upper,
    .teacher > .teacher-legs {
      position:absolute;
      left:-8%;
      bottom:-6%;
      width:92%;
      height:auto;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      pointer-events:none;
    }

    .teacher > .teacher-legs { z-index:1; }
    .teacher > .teacher-upper { z-index:2; }

    .teacher > .teacher-legs-a { opacity:1; }
    .teacher > .teacher-legs-b { opacity:0; }

    .teacher.walking > #teacherSprite.frame-b ~ .teacher-legs-a { opacity:0; }

    .teacher:not(.walking) > .teacher-legs-a { opacity:1; }
    .teacher:not(.walking) > .teacher-legs-b { opacity:0; }

    .teacher .pointer {
      left:69%;
      top:34%;
      width:72%;
      z-index:3;
    }

    .teacher.walking {
      animation:walk-in-v57 1.18s steps(16,end) forwards !important;
    }
    .teacher.arrived { transform:translateX(12%) !important; }

    @keyframes walk-in-v57 {
      from { transform:translateX(-125%); }
      to { transform:translateX(12%); }
    }
